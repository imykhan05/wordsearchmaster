# -Xmx8G/-XX:MaxMetaspaceSize=4G assumed far more RAM than every build
# machine actually has — a 7G-total-RAM Windows laptop crashed the Gradle
# daemon outright (native malloc failure inside R8, mid-release-minify,
# after the JVM's own heap+metaspace request left too little native memory
# for anything else). These ceilings must stay well under whatever the
# smallest real build machine has, alongside the OS, the IDE, and Kotlin's
# own separate daemon (capped below).
org.gradle.jvmargs=-Xmx2G -XX:MaxMetaspaceSize=1G -XX:ReservedCodeCacheSize=384m -XX:+HeapDumpOnOutOfMemoryError
kotlin.daemon.jvm.options=-Xmx1280m
android.useAndroidX=true
# Kotlin's incremental-compilation cache tries to relativize plugin source
# paths (under the pub-cache, e.g. C:\...) against the project's android/
# root — on Windows, when those live on different drive letters, that throws
# "this and base files have different roots" and fails every native plugin's
# compileReleaseKotlin task. Full (non-incremental) compilation sidesteps the
# relative-path bookkeeping entirely; it's slower per build, never wrong.
kotlin.incremental=false
# This newDsl flag was added by the Flutter template
android.newDsl=false
# This builtInKotlin flag was added by the Flutter template
android.builtInKotlin=false
