org.gradle.jvmargs=-Xmx8G -XX:MaxMetaspaceSize=4G -XX:ReservedCodeCacheSize=512m -XX:+HeapDumpOnOutOfMemoryError
android.useAndroidX=true
# Kotlin's incremental-compilation cache tries to relativize plugin source
# paths (under the pub-cache, e.g. C:\...) against the project's android/
# root — on Windows, when those live on different drive letters, that throws
# "this and base files have different roots" and fails every native plugin's
# compileReleaseKotlin task. Full (non-incremental) compilation sidesteps the
# relative-path bookkeeping entirely; it's slower per build, never wrong.
kotlin.incremental=false
# This newDsl flag was added by the Flutter template
android.newDsl=false
# This builtInKotlin flag was added by the Flutter template
android.builtInKotlin=false
