name: CI

on: push

jobs:
  ci:
    name: Analyze, test, domain purity
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Generate code (riverpod_generator)
        run: dart run build_runner build --delete-conflicting-outputs

      - name: flutter analyze
        run: flutter analyze

      - name: domain-purity check
        run: dart run tool/check_domain_purity.dart

      - name: no-raw-colors check
        run: dart run tool/check_no_raw_colors.dart

      - name: flutter test
        run: flutter test
