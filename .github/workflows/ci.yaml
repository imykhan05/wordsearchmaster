name: CI

on: push

jobs:
  ci:
    name: Analyze, test, domain purity
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install sqlite3
        # P08's Drift tests open real SQLite databases through
        # `NativeDatabase`, which dlopen()s libsqlite3 from the HOST — the
        # `sqlite3_flutter_libs` bundle only covers the app on a device, not
        # `flutter test` on a runner.
        run: sudo apt-get update && sudo apt-get install -y libsqlite3-dev

      - name: Install dependencies
        run: flutter pub get

      - name: Generate localizations
        # `flutter analyze` does not trigger gen-l10n the way run/build do.
        run: flutter gen-l10n

      - name: Fail on untranslated messages
        # A missing translation must be loud here, not a silent English
        # fallback shipped to an Urdu player.
        run: |
          if [ -s l10n_untranslated.json ]; then
            echo "Untranslated messages:"; cat l10n_untranslated.json; exit 1
          fi

      - name: Generate code (riverpod_generator, freezed, drift_dev)
        run: dart run build_runner build

      - name: flutter analyze
        run: flutter analyze

      - name: domain-purity check
        run: dart run tool/check_domain_purity.dart

      - name: no-raw-colors check
        run: dart run tool/check_no_raw_colors.dart

      - name: localized-strings check
        run: dart run tool/check_localized_strings.dart

      - name: content validation (schema + 900-level placement + 500x fuzz)
        run: dart run tool/validate_content.dart

      - name: flutter test
        run: flutter test

  functions:
    name: Cloud Functions (scoring parity, validation, emulator)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: functions/package-lock.json

      - uses: actions/setup-java@v4
        # The Firestore emulator is a Java program. Without a JRE the
        # integration suite cannot run at all, and P14's first and third
        # acceptance criteria are exactly what it proves.
        with:
          distribution: temurin
          java-version: '21'

      - name: Install dependencies
        run: npm ci
        working-directory: functions

      - name: format check
        run: npm run format:check
        working-directory: functions

      - name: lint
        run: npm run lint
        working-directory: functions

      - name: typecheck (src + test)
        run: npm run typecheck
        working-directory: functions

      - name: unit tests (scoring parity, validation, level curve)
        # scoring_parity.test.ts is one half of the cross-language contract;
        # the other half (that the fixture still matches scoring.dart) runs in
        # the `flutter test` job above, as test/tool/scoring_fixtures_test.dart.
        run: npm test
        working-directory: functions

      - name: Install the Firebase CLI
        run: npm install -g firebase-tools

      - name: integration tests against the Firestore + Auth emulators
        run: npm run test:emulator
        working-directory: functions
